<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Revê VAR</title>
    <meta
      name="description"
      content="Replay automático para quadras esportivas. Assista e baixe os lances do seu jogo, gravados por duas câmeras."
    />
    <!-- Static Open Graph tags (spec §11) — a client-rendered SPA has no per-page
         server-rendered meta, so link previews (e.g. WhatsApp) always see these.
         og:image is root-relative for now; switch to an absolute URL once the
         production domain is confirmed (build-plan.md M11). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Revê VAR" />
    <meta property="og:title" content="Revê VAR" />
    <meta
      property="og:description"
      content="Replay automático para quadras esportivas. Assista e baixe os lances do seu jogo, gravados por duas câmeras."
    />
    <meta property="og:image" content="/logo-white.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
