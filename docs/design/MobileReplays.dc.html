<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Revê VAR · Replays celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#08090A}
a{color:#FAFAFA;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.chips{scrollbar-width:none;-ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; min-height: 1900px; box-sizing: border-box; background: #08090A; color: #FAFAFA; font-family: 'Inter', system-ui, sans-serif">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.07)">
<a href="MobileHome.dc.html" aria-label="Revê VAR, página inicial"><img src="/_blob/2b3b6c2b89d16a6d72ab57a759328966" alt="Revê VAR" style="height: 34px; width: auto; display: block"></a>
<div style="display: flex; gap: 8px">
<a href="https://wa.me/" aria-label="Fale conosco no WhatsApp" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg></a>
<a href="MobileMenu.dc.html" aria-label="Abrir menu" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: #FAFAFA; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16"/><path d="M4 16h16"/></svg></a>
</div>
</header>

<section style="padding: 28px 16px 14px; display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Anton', sans-serif; font-weight: 400; font-size: 44px; text-transform: uppercase; line-height: 1">Replays</h1>
<span style="font-size: 14px; color: #A1A1AA">Escolha onde e quando você jogou.</span>
</section>

<section aria-label="Filtros" style="position: sticky; top: 0; z-index: 5; background: rgba(8,9,10,0.9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding: 10px 0 14px; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; gap: 10px">
<div style="padding: 0 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<label style="display: flex; flex-direction: column; gap: 4px; padding: 8px 12px; border-radius: 12px; background: #111214; border: 1px solid rgba(255,255,255,0.08)">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #71717A">Clube</span>
<select style="appearance: none; -webkit-appearance: none; border: 0; padding: 0; background: transparent; color: #FAFAFA; font-family: inherit; font-size: 15px; font-weight: 600"><option>Tupi</option></select>
</label>
<label style="display: flex; flex-direction: column; gap: 4px; padding: 8px 12px; border-radius: 12px; background: #111214; border: 1px solid rgba(255,255,255,0.08)">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #71717A">Quadra</span>
<select style="appearance: none; -webkit-appearance: none; border: 0; padding: 0; background: transparent; color: #FAFAFA; font-family: inherit; font-size: 15px; font-weight: 600"><option>Quadra 1</option><option>Quadra 2</option></select>
</label>
</div>
<div style="padding: 0 16px">
<div role="group" aria-label="Dia" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 4px; gap: 4px; border-radius: 12px; background: #111214; border: 1px solid rgba(255,255,255,0.08)">
<sc-for list="{{days}}" as="d" hint-placeholder-count="2">
<button type="button" onClick="{{d.pick}}" aria-pressed="{{d.on}}" style="{{d.style}}">{{d.label}}</button>
</sc-for>
<button type="button" style="height: 40px; border-radius: 9px; border: 0; background: transparent; color: #A1A1AA; font-size: 14px; font-weight: 500">Outra data</button>
</div>
</div>
<div class="chips" style="display: flex; gap: 6px; overflow-x: auto; padding: 0 16px">
<sc-for list="{{hours}}" as="h" hint-placeholder-count="6">
<button type="button" onClick="{{h.pick}}" aria-pressed="{{h.on}}" style="{{h.style}}">{{h.label}}</button>
</sc-for>
</div>
</section>

<section aria-labelledby="res" style="padding: 18px 16px 32px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: baseline; gap: 10px">
<h2 id="res" style="margin: 0; font-size: 18px; font-weight: 700">{{resultTitle}}</h2>
<span style="font-size: 13px; color: #71717A">{{resultCount}}</span>
</div>
<sc-for list="{{events}}" as="ev" hint-placeholder-count="4">
<article style="background: linear-gradient(180deg, #141518 0%, #0F1012 100%); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 10px">
<a href="MobileReplay.dc.html" aria-label="Assistir replay das {{ev.time}}" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
<div style="position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: #1A1C20">
<svg viewBox="0 0 160 90" style="position: absolute; inset: 0; width: 100%; height: 100%" aria-hidden="true"><g fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1"><rect x="10" y="10" width="140" height="70"/><line x1="80" y1="10" x2="80" y2="80"/><circle cx="80" cy="45" r="11"/></g></svg>
<span style="position: absolute; top: 6px; left: 6px; padding: 3px 7px; border-radius: 999px; background: rgba(0,0,0,0.55); font-size: 10px; font-weight: 600">Câm 1</span>
</div>
<div style="position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: #1A1C20">
<svg viewBox="0 0 160 90" style="position: absolute; inset: 0; width: 100%; height: 100%" aria-hidden="true"><g fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1"><polygon points="38,14 122,14 154,84 6,84"/><line x1="80" y1="14" x2="80" y2="84"/></g></svg>
<span style="position: absolute; top: 6px; left: 6px; padding: 3px 7px; border-radius: 999px; background: rgba(0,0,0,0.55); font-size: 10px; font-weight: 600">Câm 2</span>
</div>
</a>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 4px 2px">
<div style="display: flex; flex-direction: column">
<span style="font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums">{{ev.time}}</span>
<span style="font-size: 12px; color: #71717A">35s · 2 ângulos</span>
</div>
<div style="display: flex; gap: 8px">
<a href="MobileReplay.dc.html" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px; border-radius: 11px; background: #E10613; color: #FFFFFF; font-size: 14px; font-weight: 700; box-shadow: 0 1px 0 rgba(255,255,255,0.25) inset"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>Ver</a>
<button type="button" aria-label="Baixar replay das {{ev.time}}" style="width: 44px; height: 44px; border-radius: 11px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: #FAFAFA; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></button>
</div>
</div>
</article>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="border: 1px dashed rgba(255,255,255,0.14); border-radius: 18px; padding: 32px 16px; text-align: center; color: #A1A1AA; font-size: 14px">Nenhum replay nesse horário.</div>
</sc-if>
</section>

<footer style="padding: 24px 16px 32px; border-top: 1px solid rgba(255,255,255,0.07); font-size: 12px; color: #71717A; display: flex; flex-direction: column; gap: 6px">
<span>Replays disponíveis por [prazo a confirmar]</span>
<span>© 2026 Revê VAR</span>
</footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { day: 'hoje', hour: '19h' };
}
renderVals() {
const s = this.state;
const all = [
{ time: '19:58', h: '19h' }, { time: '19:43', h: '19h' }, { time: '19:38', h: '19h' },
{ time: '19:31', h: '19h' }, { time: '19:22', h: '19h' }, { time: '19:07', h: '19h' },
{ time: '20:12', h: '20h' }, { time: '20:04', h: '20h' },
{ time: '18:51', h: '18h' }, { time: '18:30', h: '18h' }
];
const events = s.hour === 'todos' ? all : all.filter((e) => e.h === s.hour);
const names = { hoje: 'Hoje', ontem: 'Ontem' };
const days = ['hoje', 'ontem'].map((id) => ({
label: names[id], on: s.day === id,
style: { height: '40px', borderRadius: '9px', border: 0, fontSize: '14px', fontWeight: s.day === id ? 600 : 500, background: s.day === id ? '#FAFAFA' : 'transparent', color: s.day === id ? '#08090A' : '#A1A1AA' },
pick: () => this.setState({ day: id })
}));
const hours = ['todos', '17h', '18h', '19h', '20h', '21h'].map((id) => ({
label: id === 'todos' ? 'Todos' : id, on: s.hour === id,
style: { flex: 'none', height: '44px', padding: '0 16px', borderRadius: '999px', fontSize: '14px', fontWeight: 600, border: '1px solid ' + (s.hour === id ? '#E10613' : 'rgba(255,255,255,0.1)'), background: s.hour === id ? 'rgba(225,6,19,0.14)' : 'transparent', color: s.hour === id ? '#FFFFFF' : '#A1A1AA' },
pick: () => this.setState({ hour: id })
}));
const n = events.length;
return {
days: days, hours: hours, events: events,
resultTitle: names[s.day] + (s.hour === 'todos' ? '' : ', ' + s.hour),
resultCount: n === 1 ? '1 replay' : n + ' replays',
empty: n === 0
};
}
}
</script>
</body>
</html>
