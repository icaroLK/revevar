<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Revê VAR · Replay celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#08090A}
a{color:#FAFAFA;text-decoration:none}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; min-height: 1300px; box-sizing: border-box; background: #08090A; color: #FAFAFA; font-family: 'Inter', system-ui, sans-serif">

<header style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.07)">
<a href="MobileReplays.dc.html" aria-label="Voltar aos replays" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); display: flex; align-items: center; justify-content: center; flex: none"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg></a>
<div style="display: flex; flex-direction: column">
<span style="font-size: 17px; font-weight: 700">Hoje, 19:43</span>
<span style="font-size: 12px; color: #71717A">Tupi · Quadra 1 · 35s</span>
</div>
</header>

<div style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 12px">
<div role="tablist" aria-label="Ângulo" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; gap: 4px; border-radius: 12px; background: #111214; border: 1px solid rgba(255,255,255,0.08)">
<sc-for list="{{views}}" as="v" hint-placeholder-count="2">
<button type="button" role="tab" aria-selected="{{v.on}}" onClick="{{v.pick}}" style="{{v.style}}">{{v.label}}</button>
</sc-for>
</div>

<div style="position: relative; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: #1A1C20; border: 1px solid rgba(255,255,255,0.08)">
<sc-if value="{{isC1}}" hint-placeholder-val="{{ true }}">
<svg viewBox="0 0 160 90" style="position: absolute; inset: 0; width: 100%; height: 100%" aria-hidden="true"><g fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="0.8"><rect x="10" y="10" width="140" height="70"/><line x1="80" y1="10" x2="80" y2="80"/><circle cx="80" cy="45" r="11"/><rect x="10" y="29" width="16" height="32"/><rect x="134" y="29" width="16" height="32"/></g></svg>
</sc-if>
<sc-if value="{{isC2}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 160 90" style="position: absolute; inset: 0; width: 100%; height: 100%" aria-hidden="true"><g fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="0.8"><polygon points="38,14 122,14 154,84 6,84"/><line x1="80" y1="14" x2="80" y2="84"/><ellipse cx="80" cy="46" rx="15" ry="9"/></g></svg>
</sc-if>
<span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center"><button type="button" aria-label="Reproduzir" style="width: 60px; height: 60px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg></button></span>
<div style="position: absolute; left: 12px; right: 12px; bottom: 12px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.22)">
<div style="position: absolute; left: 85.7%; top: -4px; width: 3px; height: 12px; border-radius: 2px; background: #E10613"></div>
</div>
</div>
<p style="margin: 0; font-size: 13px; color: #71717A">A marca vermelha na barra é o momento em que o botão foi apertado.</p>
</div>

<div style="padding: 18px 16px 0; display: flex; flex-direction: column; gap: 10px">
<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 54px; border-radius: 14px; border: 0; background: #E10613; color: #FFFFFF; font-size: 16px; font-weight: 700; box-shadow: 0 1px 0 rgba(255,255,255,0.25) inset, 0 10px 30px rgba(225,6,19,0.3)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
{{downloadLabel}}</button>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: #FAFAFA; font-size: 14px; font-weight: 600">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>
WhatsApp</button>
<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: #FAFAFA; font-size: 14px; font-weight: 600">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
Copiar link</button>
</div>
<span style="display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; padding: 6px 11px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.03); font-size: 12px; color: #D4D4D8">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
Disponível por [prazo a confirmar]</span>
</div>

<section aria-labelledby="mais" style="padding: 28px 16px 32px; display: flex; flex-direction: column; gap: 8px">
<h2 id="mais" style="margin: 0 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #71717A">Mais lances às 19h</h2>
<sc-for list="{{others}}" as="o" hint-placeholder-count="4">
<a href="MobileReplay.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 14px; background: #111214; border: 1px solid rgba(255,255,255,0.06)">
<div style="position: relative; width: 104px; flex: none; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: #1A1C20">
<svg viewBox="0 0 160 90" style="position: absolute; inset: 0; width: 100%; height: 100%" aria-hidden="true"><g fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1"><rect x="10" y="10" width="140" height="70"/><line x1="80" y1="10" x2="80" y2="80"/></g></svg>
</div>
<div style="display: flex; flex-direction: column; flex: 1">
<span style="font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums">{{o.time}}</span>
<span style="font-size: 12px; color: #71717A">2 ângulos</span>
</div>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#71717A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
</a>
</sc-for>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { view: 'c1' };
}
renderVals() {
const v = this.state.view;
const views = [['c1', 'Câmera 1'], ['c2', 'Câmera 2']].map(([id, label]) => ({
label: label, on: v === id,
style: { height: '42px', borderRadius: '9px', border: 0, fontSize: '14px', fontWeight: v === id ? 600 : 500, background: v === id ? '#FAFAFA' : 'transparent', color: v === id ? '#08090A' : '#A1A1AA' },
pick: () => this.setState({ view: id })
}));
return {
views: views, isC1: v === 'c1', isC2: v === 'c2',
downloadLabel: v === 'c2' ? 'Baixar câmera 2' : 'Baixar câmera 1',
others: [{ time: '19:58' }, { time: '19:38' }, { time: '19:31' }, { time: '19:22' }]
};
}
}
</script>
</body>
</html>
