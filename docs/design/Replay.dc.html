<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1400}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { view: 'c1' };
}
renderVals() {
const v = this.state.view;
const views = [['c1', 'Câmera 1'], ['c2', 'Câmera 2'], ['both', 'Lado a lado']].map(([id, label]) => ({
label: label, on: v === id,
style: { height: '38px', padding: '0 16px', borderRadius: '9px', border: 0, fontSize: '14px', fontWeight: v === id ? 600 : 500, background: v === id ? '#FAFAFA' : 'transparent', color: v === id ? '#08090A' : '#A1A1AA' },
pick: () => this.setState({ view: id })
}));
const rows = [['19:58', 'Câmeras 1 e 2'], ['19:43', 'Assistindo agora'], ['19:38', 'Câmeras 1 e 2'], ['19:31', 'Câmeras 1 e 2'], ['19:22', 'Só câmera 1']];
const others = rows.map(([time, note]) => ({
time: time, note: note,
style: { display: 'flex', alignItems: 'center', gap: '12px', padding: '8px', borderRadius: '12px', color: '#FAFAFA', background: time === '19:43' ? 'rgba(255,255,255,0.06)' : 'transparent', border: '1px solid ' + (time === '19:43' ? 'rgba(255,255,255,0.12)' : 'transparent') }
}));
return {
views: views, others: others,
single: v !== 'both', both: v === 'both', isC1: v === 'c1', isC2: v === 'c2',
camLabel: v === 'c2' ? 'Câmera 2' : 'Câmera 1',
downloadLabel: v === 'both' ? 'Baixar os 2 ângulos' : (v === 'c2' ? 'Baixar câmera 2' : 'Baixar câmera 1'),
otherDownload: v === 'c2' ? 'Baixar câmera 1' : 'Baixar câmera 2'
};
}
}
</script>
